name: Android Clipboard GUI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/src/androidTest/**'
      - 'app/build.gradle.kts'
      - '.github/workflows/android-clipboard-gui.yml'

permissions:
  contents: read

jobs:
  emulator-gui:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC"'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build app and instrumentation APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Android emulator UI test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system screen_off_timeout 1800000
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell mkdir -p /sdcard/Download/fga-gui-test
            adb shell am instrument -w -r -e class io.github.fate_grand_automata.ClipboardImportGuiTest io.github.fate_grand_automata.debug.test/androidx.test.runner.AndroidJUnitRunner | tee instrument-results.txt
            grep -q '^OK (1 test)' instrument-results.txt
      - name: Capture screenshot, UI hierarchy and logcat
        if: always()
        run: |
          mkdir -p artifacts
          adb devices -l > artifacts/adb-devices.txt 2>&1 || true
          adb shell screencap -p /sdcard/Download/fga-gui-test/runner.png || true
          adb pull /sdcard/Download/fga-gui-test/ artifacts/ui/ || true
          adb logcat -d -v time > artifacts/logcat.txt 2>&1 || true
          cp instrument-results.txt artifacts/ 2>/dev/null || true
      - name: Upload GUI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fga-clipboard-gui-evidence
          path: artifacts/
          if-no-files-found: warn
